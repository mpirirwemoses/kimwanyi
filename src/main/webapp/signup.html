<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | Credit SACCO</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="card"><p class="eyebrow">Credit SACCO</p><h1>Create your account</h1><p id="message" class="message"></p><form method="post" action="signup"><label>Full name<input type="text" name="fullName" required maxlength="100" autocomplete="name"></label><label>Email<input type="email" name="email" required maxlength="150" autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"><small>Use at least 8 characters.</small></label><button type="submit">Create account</button></form><p class="switch">Already registered? <a href="login.html">Sign in</a></p></main><script>const e=new URLSearchParams(location.search).get('error');document.getElementById('message').textContent=e==='exists'?'An account with that email already exists.':e==='validation'?'Please provide a valid name, email, and 8-character password.':'';</script></body></html>
