<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in | Credit SACCO</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="card"><p class="eyebrow">Credit SACCO</p><h1>Welcome back</h1><p id="message" class="message"></p><form method="post" action="login"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form><p class="switch">New here? <a href="signup.html">Create an account</a></p></main><script>const p=new URLSearchParams(location.search);const m=document.getElementById('message');if(p.has('registered'))m.textContent='Account created. Please sign in.';if(p.get('error')==='invalid')m.textContent='Incorrect email or password.';</script></body></html>
